
name: Build Kyiv.city APK

"on":
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname 'KyivCity-Android-Project*.zip' -print -quit)"
          test -n "$ZIP_FILE"
          mkdir project
          unzip -q "$ZIP_FILE" -d project
          test -d project/KyivCity-Android

      - name: Build APK
        run: |
          cd project/KyivCity-Android
          gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Kyiv-city-APK
          path: project/KyivCity-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
