name: name: Build Kyiv.city APK

"on":

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          mkdir project
          unzip -q KyivCity-Android-Project.zip -d project
          find project -name gradlew -type f

      - name: Build APK
        run: |
          cd project/KyivCity-Android
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kyiv-city-APK
          path: project/KyivCity-Android/app/build/outputs/apk/debug/app-debug.apk
